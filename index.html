<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Автоматичен чат</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="title-group">
        <h1>Автоматичен чат</h1>
        <p>Натиснете бутона, за да започнете автоматичен разговор с произволни потребители.</p>
      </div>
      <div class="controls">
        <button id="startButton">START CHAT</button>
        <div class="subscribers">
          <span class="label">Subscribers</span>
          <strong id="subscriberCount">12.3K</strong>
        </div>
      </div>
    </header>

    <main>
      <section class="chat-panel">
        <div id="chatWindow" class="chat-window"></div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
